<!doctype html>
<html lang="en" data-jarvis-demo-host="tradingview">
  <head>
    <meta charset="utf-8" />
    <title>Jarvis demo — TradingView chart overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #131722;
        color: #d1d4dc;
        font: 12px/1.4 Inter, sans-serif;
      }
      .tv-top {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        border-bottom: 1px solid #2a2e39;
        background: #1e222d;
      }
      .tv-left {
        position: absolute;
        top: 48px;
        bottom: 28px;
        left: 0;
        width: 52px;
        border-right: 1px solid #2a2e39;
        background: #1e222d;
      }
      [data-name="chart-container"] {
        position: absolute;
        top: 48px;
        left: 52px;
        right: 0;
        bottom: 28px;
        overflow: hidden;
        background: #131722;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .legend {
        position: absolute;
        top: 10px;
        left: 12px;
        z-index: 2;
        font: 600 13px/1.3 "JetBrains Mono", ui-monospace, monospace;
      }
      .price-axis {
        position: absolute;
        top: 48px;
        right: 8px;
        bottom: 28px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font: 600 11px/1 "JetBrains Mono", ui-monospace, monospace;
        color: #8b8e97;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <header class="tv-top">TradingView · AAPL · 1D · MOCK overlay preview</header>
    <aside class="tv-left"></aside>
    <div data-name="chart-container">
      <div class="legend" data-name="legend-source-item">AAPL&nbsp;&nbsp;336.12</div>
      <aside class="price-axis" data-name="price-axis">
        <div>348.00</div>
        <div>336.12</div>
        <div>324.00</div>
      </aside>
      <canvas id="candles" width="1600" height="900"></canvas>
    </div>
    <script>
      const canvas = document.getElementById("candles");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#131722";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 42; i += 1) {
        const x = 40 + i * 36;
        const high = 180 + Math.sin(i / 4) * 90;
        const low = high + 80;
        const open = high + 30;
        const close = low - 20;
        ctx.strokeStyle = i % 3 ? "#26a69a" : "#ef5350";
        ctx.beginPath();
        ctx.moveTo(x, high);
        ctx.lineTo(x, low);
        ctx.stroke();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fillRect(x - 8, open, 16, close - open);
      }
    </script>
    <script src="../adapters.js"></script>
    <script src="../desk-plan.js"></script>
    <script src="../content.js"></script>
  </body>
</html>
